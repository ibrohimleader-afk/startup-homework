    <!-- 1. Sarlavha -->
    <h1>Missiyaga qo'shiling yoki savol bering</h1>

    <!-- 2. Forma (select, textarea) -->
    <section>
        <h2>Aloqa formasi</h2>
        <form action="#" method="post">
            <p>
                <label for="name">Ism:</label><br>
                <input type="text" id="name" name="name" required>
            </p>
            <p>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="purpose">Murojaat turi:</label><br>
                <select id="purpose" name="purpose">
                    <option value="hamkorlik">Hamkorlik</option>
                    <option value="sayyohlik">Sayyohlik</option>
                    <option value="savol">Savol</option>
                </select>
            </p>
            <p>
                <label for="message">Qisqa xabar:</label><br>
                <textarea id="message" name="message" rows="5" cols="40" required></textarea>
            </p>
            <p>
                <button type="submit">Yuborish</button>
            </p>
        </form>
    </section>

    <hr>

    <!-- 3. address -->
    <section>
