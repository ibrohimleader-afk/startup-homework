<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background</title>

    <style>
        section {
            width: 100%;
            height: 100vh;

            /* Nomlangan rang */
            background-color: navy;

            /* HEX format */
            background-image: url("image.png");

            /* Rasm butun blokni qoplaydi */
            background-size: cover;

            /* Rasm markazda joylashadi */
            background-position: center;

            background-repeat: no-repeat;

            /* RGB / RGBA format */
            color: rgb(255, 255, 255);

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 40px;
        }
    </style>
</head>

<body>

    <section>
        <h1>My Background</h1>
    </section>

    <!--
    background-size: cover — rasm butun blokni to‘liq qoplaydi.
    Rasmning ayrim qismlari kesilishi mumkin.

    background-size: contain — rasmning to‘liq ko‘rinishi saqlanadi,
    lekin blokning ayrim joylarida bo‘sh joy qolishi mumkin.
    -->

</body>
</html>
