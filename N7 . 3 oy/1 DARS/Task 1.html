<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-vazifa. Sxema</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .container { display: flex; align-items: center; gap: 20px; }
        .block { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 250px; text-align: center; border: 2px solid #333; }
        .arrows { display: flex; flex-direction: column; align-items: center; font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <div class="block">
            <h3>🖥️ Frontend</h3>
            <p><b>Klient qismi</b></p>
            <p>Foydalanuvchi ko'radigan qism, tugmalar, dizayn. (HTML, CSS, JS)</p>
        </div>
        <div class="arrows">
            <div>So'rov (Request) ➡️</div>
            <br>
            <div>⬅️ Javob (Response)</div>
        </div>
        <div class="block">
            <h3>⚙️ Backend</h3>
            <p><b>Server qismi</b></p>
            <p>Saytning ichki mantig'i, server va ma'lumotlar bazasi.</p>
        </div>
    </div>
</body>
</html>
